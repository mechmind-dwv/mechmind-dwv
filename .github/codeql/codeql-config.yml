name: "MechMind Security Protocol"

disable-default-queries: false

paths:
  include:
    - projects/mechbot-2x/src
    - docs/ai-research
  exclude:
    - "**/tests/**"
    - "**/experimental/**"

# Nota: Los query-filters de CodeQL no soportan definiciones de queries en línea (QL) de esta forma.
# Se deben usar archivos .ql o suites .qls. Por ahora, eliminamos los filtros inválidos 
# para que el pipeline no falle y usaremos las queries por defecto.
