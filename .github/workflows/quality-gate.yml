name: MechMind Quality Gate

on: [push, pull_request]

permissions:
  contents: read
  actions: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install bandit safety pytest coverage pytest-cov

      - name: Run security scans
        run: |
          mkdir -p reports
          if [ -d src ]; then
            bandit -r src -f json -o reports/bandit_results.json || true
          fi
          safety check --output json > reports/safety_report.json || true

      - name: Run tests with coverage
        run: |
          if [ -d tests ]; then
            coverage run -m pytest tests/ || true
            coverage xml -o reports/coverage.xml || true
            coverage report || true
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: reports/
