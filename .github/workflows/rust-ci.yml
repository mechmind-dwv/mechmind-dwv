name: "🦀 Rust Super Pipeline"

on: [push, pull_request]

jobs:
  test:
    name: "Test Suite (MechBot-2X)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Run tests
        run: cargo test --all-features --verbose
      - name: Run benchmarks (compile only)
        run: cargo bench --all-features --no-run

  security:
    name: "🔒 Cargo Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run security audit
        run: cargo audit

  coverage:
    name: "📊 Code Coverage & Run"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Generate coverage report
        run: cargo tarpaulin --all-features --out Html --output-dir .
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tarpaulin-report.html
      - name: Build and run mechcore binary
        working-directory: projects/mechcore
        run: cargo run --release
