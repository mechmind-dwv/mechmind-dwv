name: "🦀 Rust Super Pipeline"

on: [push, pull_request]

env:
  ROS_DISTRO: humble
  RUSTUP_TOOLCHAIN: nightly

jobs:
  test:
    name: "Test Suite (MechBot-2X)"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup ROS2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Setup Rust (Nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Run tests
        run: |
          source /opt/ros/humble/setup.bash
          cargo +nightly test --all-features --verbose

      - name: Run benchmarks (compile only)
        run: |
          source /opt/ros/humble/setup.bash
          cargo +nightly bench --all-features --no-run

  security:
    name: "🔒 Cargo Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run security audit
        run: cargo audit

  coverage:
    name: "📊 Code Coverage & Run"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup ROS2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Setup Rust (Nightly for SIMD)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage report
        run: |
          source /opt/ros/humble/setup.bash
          # Forzar nightly en tarpaulin
          cargo +nightly tarpaulin --all-features --out Html --output-dir .

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tarpaulin-report.html

      - name: Build and run mechcore binary
        working-directory: projects/mechcore
        run: |
          source /opt/ros/humble/setup.bash
          cargo +nightly run --release
