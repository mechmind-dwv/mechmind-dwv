name: "🦀 Rust Super Pipeline"

on: [push, pull_request]

env:
  ROS_DISTRO: humble
  RUSTUP_TOOLCHAIN: nightly

permissions:
  contents: read

jobs:
  test:
    name: "Test Suite (MechBot-2X)"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (Nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Run tests
        run: cargo +nightly test --verbose

      - name: Run benchmarks (compile only)
        run: cargo +nightly bench --no-run

  security:
    name: "🔒 Cargo Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run security audit
        run: cargo audit

  coverage:
    name: "📊 Code Coverage & Run"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (Nightly for SIMD)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Generate coverage report
        run: |
          # Forzar nightly en tarpaulin; el job usa las features por defecto.
          cargo +nightly tarpaulin --out Html --output-dir .

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tarpaulin-report.html

      - name: Build and run mechcore binary
        working-directory: projects/mechcore
        run: cargo +nightly run --release
