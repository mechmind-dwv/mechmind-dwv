name: 🚀 MechMind Profile Power-Up
on:
  schedule:
    - cron: "0 12 * * *"  # Daily at noon UTC (¡hora del café!)
  push:
    branches: [ "main" ]
  workflow_dispatch:       # Trigger manual

jobs:
  supercharge-profile:
    name: ⚡ Actualización Dinámica
    runs-on: ubuntu-latest
    steps:
      # Paso 1: Checkout mágico
      - name: 🛸 Clonar Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Para stats de commits

      # Paso 2: Actualizar README.md con stats
      # Nota: anuraghazra/github-readme-stats es una API externa, 
      # aquí usamos un script simple para simular la actualización si fuera necesario
      # o simplemente dejamos que el README use las URLs dinámicas.

      # Paso 3: Actualizar tecnologías (¡Rust primero!)
      - name: 🦀 Tech Radar
        run: |
          echo "## 🛠️ Stack Tecnológico Actualizado" >> README.md
          echo "- 🦀 **Rust** v$(curl -s https://api.github.com/repos/rust-lang/rust/releases/latest | jq -r '.tag_name')" >> README.md
          echo "- 🤖 **ROS2** Humble Hawksbill" >> README.md

      # Paso 4: Commit
      - name: 💾 Guardar Cambios
        run: |
          git config --global user.name "MechMind Bot"
          git config --global user.email "bot@mechmind.tech"
          git add README.md
          git commit -m "✨ Auto-update: $(date +'%d/%m/%Y %H:%M')" || echo "No changes to commit"
          git push || echo "No changes to push"

  deploy-mechbot:
    name: 🤖 Deploy MechBot-2X
    needs: supercharge-profile
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'mechbot')
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Install ROS2 Humble
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install -y curl gnupg2
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.asc | sudo apt-key add -
          sudo add-apt-repository "deb [arch=amd64] http://packages.ros.org/ros2/ubuntu $(lsb_release -cs) main"
          sudo apt-get update
          sudo apt-get install -y ros-humble-desktop
      - name: Build MechBot
        run: |
          cd projects/mechbot-2x
          cargo build --release
