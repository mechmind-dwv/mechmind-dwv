name: 🚀 MechMind Profile Power-Up
on:
  schedule:
    - cron: "0 12 * * *"  # Daily at noon UTC (¡hora del café!)
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  supercharge-profile:
    name: ⚡ Actualización Dinámica
    runs-on: ubuntu-latest
    steps:
      - name: 🛸 Clonar Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🦀 Tech Radar
        run: |
          RUST_VERSION=$(curl -s https://api.github.com/repos/rust-lang/rust/releases/latest | jq -r '.tag_name')
          NEW_STACK="## 🛠️ Stack Tecnológico Actualizado\n- 🦀 **Rust** ${RUST_VERSION}\n- 🤖 **ROS2** Humble Hawksbill"
          sed -i "/<!-- START_TECH_STACK -->/,/<!-- END_TECH_STACK -->/{ /<!-- START_TECH_STACK -->/b; /<!-- END_TECH_STACK -->/b; d }" README.md
          sed -i "/<!-- START_TECH_STACK -->/a ${NEW_STACK}" README.md

      - name: 💾 Guardar Cambios
        run: |
          git config --global user.name "MechMind Bot"
          git config --global user.email "bot@mechmind.tech"
          git add README.md
          git commit -m "✨ Auto-update: $(date +'%d/%m/%Y %H:%M')" || echo "No changes to commit"
          git push || echo "No changes to push"

  deploy-mechbot:
    name: 🤖 Deploy MechBot-2X
    needs: supercharge-profile
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'mechbot')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Setup ROS2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - name: Build MechBot
        run: |
          cd projects/mechbot-2x
          cargo build --release
